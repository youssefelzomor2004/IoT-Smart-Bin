<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartBin — Live Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
  <style>
    :root {
      --bg:        #0a0c0f;
      --surface:   #111418;
      --panel:     #161b22;
      --border:    #21262d;
      --accent:    #00e5a0;
      --accent2:   #00b8ff;
      --warn:      #ff9500;
      --danger:    #ff3b3b;
      --text:      #e6edf3;
      --muted:     #6e7681;
      --mono:      'Share Tech Mono', monospace;
      --sans:      'Barlow Condensed', sans-serif;
    }
 
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      letter-spacing: 0.02em;
    }
 
    /* Scanline texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 999;
    }
 
    /* ── Header ── */
    .header {
      width: 100%;
      max-width: 820px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
 
    .logo {
      font-family: var(--sans);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
 
    .logo span { color: var(--accent); }
 
    .conn-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      transition: color .3s, border-color .3s;
    }
 
    .conn-pill .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background .3s, box-shadow .3s;
    }
 
    .conn-pill.ok   { color: var(--accent); border-color: rgba(0,229,160,.25); }
    .conn-pill.ok .dot {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    .conn-pill.err  { color: var(--danger); border-color: rgba(255,59,59,.25); }
    .conn-pill.err .dot { background: var(--danger); }
 
    @keyframes pulse-dot {
      0%,100% { opacity: 1; }
      50%      { opacity: .4; }
    }
 
    /* ── Main grid ── */
    .grid {
      width: 100%;
      max-width: 820px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 16px;
    }
 
    /* ── Panel base ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      position: relative;
      overflow: hidden;
      animation: fadeUp .6s ease both;
    }
 
    .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .4;
    }
 
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
 
    .panel:nth-child(2) { animation-delay: .1s; }
    .panel:nth-child(3) { animation-delay: .2s; }
    .panel:nth-child(4) { animation-delay: .3s; }
 
    .panel-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }
 
    /* ── Fill level panel (spans both cols) ── */
    .panel-fill {
      grid-column: 1 / -1;
    }
 
    .fill-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
 
    .fill-number {
      font-family: var(--mono);
      font-size: 72px;
      line-height: 1;
      color: var(--accent);
      transition: color .5s;
      text-shadow: 0 0 30px rgba(0,229,160,.35);
    }
 
    .fill-number.warn   { color: var(--warn);   text-shadow: 0 0 30px rgba(255,149,0,.35); }
    .fill-number.danger { color: var(--danger);  text-shadow: 0 0 30px rgba(255,59,59,.35); }
 
    .fill-pct { font-family: var(--mono); font-size: 28px; color: var(--muted); }
 
    .fill-state-badge {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 6px;
      border: 1px solid;
      transition: all .4s;
    }
 
    /* Bar track */
    .bar-track {
      height: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
 
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 3px;
      transition: width .8s cubic-bezier(.4,0,.2,1), background .5s;
      position: relative;
    }
 
    /* moving shimmer on bar */
    .bar-fill::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 60px;
      right: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
      animation: shimmer 1.8s ease-in-out infinite;
    }
 
    @keyframes shimmer {
      0%   { transform: translateX(-60px); opacity: 0; }
      50%  { opacity: 1; }
      100% { transform: translateX(60px);  opacity: 0; }
    }
 
    /* tick marks */
    .bar-ticks {
      display: flex;
      justify-content: space-between;
      padding: 5px 0 0;
    }
 
    .bar-ticks span {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
    }
 
    /* ── Lid panel ── */
    .lid-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 8px 0;
    }
 
    .bin-svg { transition: all .5s ease; }
 
    .bin-body {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 1.5;
      transition: stroke .4s;
    }
 
    .bin-lid {
      fill: var(--surface);
      stroke: var(--border);
      stroke-width: 1.5;
      transform-origin: 50% 100%;
      transition: transform .5s cubic-bezier(.4,0,.2,1), stroke .4s, fill .4s;
    }
 
    .bin-fill-bar {
      fill: var(--accent);
      opacity: .25;
      transition: height .8s ease, y .8s ease, fill .5s;
    }
 
    .lid-open .bin-lid  {
      transform: rotate(-55deg) translateY(-4px);
      stroke: var(--accent);
    }
 
    .lid-open .bin-body { stroke: var(--accent); }
 
    .lid-label {
      font-family: var(--mono);
      font-size: 22px;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition: color .4s;
    }
 
    .lid-label.open   { color: var(--accent); text-shadow: 0 0 12px rgba(0,229,160,.4); }
    .lid-label.closed { color: var(--muted); }
 
    /* ── Hand sensor panel ── */
    .hand-ring-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0 16px;
    }
 
    .hand-ring {
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: border-color .4s;
    }
 
    .hand-ring.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 8px rgba(0,229,160,.08), 0 0 0 16px rgba(0,229,160,.04);
      animation: ring-pulse 1.5s ease-in-out infinite;
    }
 
    @keyframes ring-pulse {
      0%,100% { box-shadow: 0 0 0 8px rgba(0,229,160,.08), 0 0 0 16px rgba(0,229,160,.04); }
      50%      { box-shadow: 0 0 0 12px rgba(0,229,160,.12), 0 0 0 24px rgba(0,229,160,.06); }
    }
 
    .hand-icon {
      font-size: 36px;
      transition: transform .4s, filter .4s;
      filter: grayscale(1) opacity(.4);
    }
 
    .hand-ring.active .hand-icon {
      filter: none;
      transform: scale(1.12);
    }
 
    .hand-dist {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
 
    /* ── Status panel ── */
    .status-big {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 38px;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin: 10px 0 6px;
      transition: color .4s;
    }
 
    .status-sub {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }
 
    .status-icon { font-size: 32px; margin-bottom: 4px; }
 
    /* ── Footer ── */
    .footer {
      margin-top: 24px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .08em;
      text-align: center;
    }
 
    #last-updated { color: var(--muted); }
 
    /* ── State-driven color classes ── */
    .state-empty    .fill-number { color: var(--accent2); text-shadow: 0 0 24px rgba(0,184,255,.3); }
    .state-empty    .bar-fill    { background: var(--accent2); }
    .state-empty    .fill-state-badge { color: var(--accent2); border-color: rgba(0,184,255,.3); background: rgba(0,184,255,.07); }
 
    .state-normal   .fill-number { color: var(--accent); }
    .state-normal   .bar-fill    { background: var(--accent); }
    .state-normal   .fill-state-badge { color: var(--accent); border-color: rgba(0,229,160,.3); background: rgba(0,229,160,.07); }
 
    .state-almostfull .fill-number { color: var(--warn); text-shadow: 0 0 24px rgba(255,149,0,.35); }
    .state-almostfull .bar-fill    { background: var(--warn); }
    .state-almostfull .fill-state-badge { color: var(--warn); border-color: rgba(255,149,0,.3); background: rgba(255,149,0,.07); }
 
    .state-full   .fill-number { color: var(--danger); text-shadow: 0 0 24px rgba(255,59,59,.4); }
    .state-full   .bar-fill    { background: var(--danger); }
    .state-full   .fill-state-badge { color: var(--danger); border-color: rgba(255,59,59,.3); background: rgba(255,59,59,.07); }
    .state-full   .panel-fill::before { background: linear-gradient(90deg, transparent, var(--danger), transparent); opacity: .5; }
 
    @media (max-width: 540px) {
      .grid { grid-template-columns: 1fr; }
      .panel-fill { grid-column: 1; }
      .fill-number { font-size: 52px; }
    }
  </style>
</head>
<body>
 
<!-- ── Header ── -->
<header class="header">
  <div class="logo">Smart<span>Bin</span></div>
  <div class="conn-pill" id="conn-pill">
    <span class="dot"></span>
    <span id="conn-text">Connecting...</span>
  </div>
</header>
 
<!-- ── Dashboard grid ── -->
<div class="grid" id="dashboard">
 
  <!-- Fill level — full width -->
  <div class="panel panel-fill" id="fill-panel">
    <div class="panel-label">// fill level</div>
    <div class="fill-header">
      <div>
        <div class="fill-number" id="fill-number">--</div>
      </div>
      <div style="text-align:right">
        <div class="fill-pct">%</div>
        <div class="fill-state-badge" id="state-badge">WAITING</div>
      </div>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="bar-fill"></div>
    </div>
    <div class="bar-ticks">
      <span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
    </div>
  </div>
 
  <!-- Lid status -->
  <div class="panel">
    <div class="panel-label">// lid status</div>
    <div class="lid-visual">
      <div class="bin-svg" id="bin-svg">
        <svg width="90" height="110" viewBox="0 0 90 110">
          <!-- bin body -->
          <rect class="bin-body" x="12" y="38" width="66" height="60" rx="4"/>
          <!-- fill indicator inside bin -->
          <rect class="bin-fill-bar" id="bin-fill-bar" x="14" y="80" width="62" height="17" rx="2"/>
          <!-- lid -->
          <rect class="bin-lid" id="bin-lid-svg" x="8" y="28" width="74" height="14" rx="3"/>
          <!-- handle -->
          <rect fill="#21262d" x="36" y="20" width="18" height="12" rx="3"/>
          <!-- stripes -->
          <line x1="30" y1="50" x2="30" y2="92" stroke="#21262d" stroke-width="1.5"/>
          <line x1="45" y1="50" x2="45" y2="92" stroke="#21262d" stroke-width="1.5"/>
          <line x1="60" y1="50" x2="60" y2="92" stroke="#21262d" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="lid-label closed" id="lid-label">CLOSED</div>
    </div>
  </div>
 
  <!-- Hand sensor -->
  <div class="panel">
    <div class="panel-label">// hand sensor</div>
    <div class="hand-ring-wrap">
      <div class="hand-ring" id="hand-ring">
        <span class="hand-icon">✋</span>
      </div>
    </div>
    <div class="hand-dist" id="hand-dist">Distance: --</div>
  </div>
 
  <!-- System status -->
  <div class="panel" id="status-panel" style="animation-delay:.25s">
    <div class="panel-label">// system state</div>
    <div class="status-icon" id="status-icon">💤</div>
    <div class="status-big" id="status-big">STANDBY</div>
    <div class="status-sub" id="status-sub">Awaiting data...</div>
  </div>
 
  <!-- Raw telemetry -->
  <div class="panel" style="animation-delay:.3s">
    <div class="panel-label">// telemetry</div>
    <div style="font-family: var(--mono); font-size: 13px; line-height: 2; color: var(--muted);">
      <div>hand_dist &nbsp;<span id="tele-hand" style="color:var(--text)">--</span> cm</div>
      <div>trash_dist <span id="tele-trash" style="color:var(--text)">--</span> cm</div>
      <div>level &nbsp;&nbsp;&nbsp;&nbsp;<span id="tele-level" style="color:var(--text)">--</span> %</div>
      <div>packets &nbsp;&nbsp;<span id="tele-packets" style="color:var(--accent)">0</span></div>
    </div>
  </div>
 
</div>
 
<div class="footer">
  <span id="last-updated">no data received yet</span>
</div>
 
<script>
  let packetCount = 0;
 
  const connection = new signalR.HubConnectionBuilder()
    .withUrl("http://localhost:5013/binHub")
    .withAutomaticReconnect([0, 2000, 5000, 10000])
    .build();
 
  // ── State classes on <body> ──────────────────────────────────────
  function setStateClass(state) {
    document.body.className = '';
    document.body.classList.add('state-' + state.toLowerCase());
  }
 
  // ── Animate the bin fill bar inside SVG ─────────────────────────
  function updateBinSvg(level) {
    const maxH = 42;  // full height of bin body interior
    const h    = Math.round((level / 100) * maxH);
    const y    = 98 - h;
    const bar  = document.getElementById('bin-fill-bar');
    bar.setAttribute('height', h);
    bar.setAttribute('y', y);
  }
 
  // ── SignalR message handler ──────────────────────────────────────
  connection.on("ReceiveBinUpdate", (level, hand, state) => {
    packetCount++;
 
    // Sanitise level
    const lvl = Math.max(0, Math.min(100, parseInt(level) || 0));
 
    // State colour class on body
    setStateClass(state);
 
    // Fill number + bar
    document.getElementById('fill-number').textContent = lvl;
    document.getElementById('bar-fill').style.width    = lvl + '%';
 
    // Badge
    const badge = document.getElementById('state-badge');
    const labels = { Empty:'EMPTY', Normal:'NORMAL', AlmostFull:'ALMOST FULL', Full:'FULL' };
    badge.textContent = labels[state] || state.toUpperCase();
 
    // Lid
    const binSvg   = document.getElementById('bin-svg');
    const lidLabel = document.getElementById('lid-label');
    if (hand) {
      binSvg.classList.add('lid-open');
      lidLabel.textContent = 'OPEN';
      lidLabel.className   = 'lid-label open';
    } else {
      binSvg.classList.remove('lid-open');
      lidLabel.textContent = 'CLOSED';
      lidLabel.className   = 'lid-label closed';
    }
 
    // Hand ring
    const ring = document.getElementById('hand-ring');
    ring.className = 'hand-ring' + (hand ? ' active' : '');
 
    // SVG bin fill bar
    updateBinSvg(lvl);
 
    // System status
    const icons = { Empty:'🪣', Normal:'✅', AlmostFull:'⚠️', Full:'🚫' };
    const subs  = {
      Empty    : 'Bin is empty.',
      Normal   : 'Bin operating normally.',
      AlmostFull: 'Bin filling up — plan collection.',
      Full     : 'Bin full — lid locked closed!'
    };
    document.getElementById('status-icon').textContent = icons[state] || '❓';
    document.getElementById('status-big').textContent  = (labels[state] || state).toUpperCase();
    document.getElementById('status-sub').textContent  = subs[state]  || '';
 
    // Telemetry (handDistance & trashDistance come from server state;
    // we only receive level/hand/state here — show what we have)
    document.getElementById('tele-level').textContent   = lvl;
    document.getElementById('tele-packets').textContent = packetCount;
 
    // Timestamp
    document.getElementById('last-updated').textContent =
      'last update: ' + new Date().toLocaleTimeString();
  });
 
  // ── Connection state callbacks ───────────────────────────────────
  function setConn(status, label) {
    const pill = document.getElementById('conn-pill');
    pill.className    = 'conn-pill ' + status;
    document.getElementById('conn-text').textContent = label;
  }
 
  connection.onreconnecting(() => setConn('', 'Reconnecting...'));
  connection.onreconnected(()  => setConn('ok', 'Live'));
  connection.onclose(()        => setConn('err', 'Disconnected'));
 
  connection.start()
    .then(()  => setConn('ok', 'Live'))
    .catch(e  => {
      setConn('err', 'Connection failed');
      console.error('[SignalR]', e);
    });
</script>
</body>
</html>
